name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/python.yml
    with:
      sql-paths: src/trawl/db/sql src/trawl/db/ddl
      build: true
